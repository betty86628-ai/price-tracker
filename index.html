/* ---------------- 主要內容（篩選列 + 分組商品清單） ---------------- */
function getBestActivePrice(productId) {
  const actives = state.data.priceRecords.filter((r) => r.productId === productId && r.status === 'active');
  if (actives.length === 0) return null;
  let best = null; let bestTwd = Infinity;
  actives.forEach((r) => {
    const twd = toTwd(r.currency, r.price, state.data.exchangeRates);
    const cmp = twd == null ? Infinity : twd;
    if (cmp < bestTwd) { bestTwd = cmp; best = Object.assign({}, r, { approxTwd: twd }); }
  });
  return best;
}

function getLatestActiveDate(productId) {
  const actives = state.data.priceRecords.filter((r) => r.productId === productId && r.status === 'active');
  if (actives.length === 0) return null;
  return actives.reduce((a, b) => (new Date(a.datetime) > new Date(b.datetime) ? a : b)).datetime;
}

function buildProductCard(product) {
  const best = getBestActivePrice(product.id);
  const latestDate = getLatestActiveDate(product.id);
  const thumb = el('div', { class: 'product-thumb' },
    product.imageUrl ? el('img', { src: product.imageUrl, alt: product.name }) : icon('tag', { size: 22, class: 'text-orange-200' })
  );
  const category = state.data.categories.find((c) => c.id === product.categoryId);
  const cardFields = ((category && category.customFields) || []).filter((f) => f.showOnCard && (product.customValues || {})[f.id]);
  const info = el('div', { class: 'product-info' }, [
    el('div', { class: 'product-brand' }, product.brand),
    el('div', { class: 'product-name font-display' }, product.name),
    el('div', { class: 'product-spec' }, product.spec),
    cardFields.length > 0
      ? el('div', { class: 'flex gap-1', style: { flexWrap: 'wrap', marginTop: '4px' } },
        cardFields.map((f) => el('span', { class: 'card-field-chip' }, (product.customValues || {})[f.id])))
      : null,
    el('div', { class: 'product-updated' }, latestDate ? daysSince(latestDate) : '尚無報價'),
  ]);
  let badgeWrap;
  if (best) {
    badgeWrap = el('div', { class: 'price-badge-wrap' }, [
      el('div', { class: 'price-badge' }, [
        el('span', { class: 'price-badge-currency tabular' }, best.currency),
        el('span', { class: 'price-badge-label' }, '最低價'),
      ]),
      el('div', { class: 'price-badge-sub tabular' },
        best.approxTwd != null && best.currency !== 'TWD'
          ? [best.price.toLocaleString(), el('br'), `≈NT$${Math.round(best.approxTwd).toLocaleString()}`]
          : best.price.toLocaleString()
      ),
    ]);
  } else {
    badgeWrap = el('div', { class: 'price-badge-wrap' }, el('div', { class: 'price-badge-empty' }, '無資料'));
  }
  const children = [thumb, info, badgeWrap];
  if (product.mustBuy) {
    children.push(el('div', { class: 'must-buy-badge' }, icon('star', { size: 12, filled: true })));
  }
  if (product.liked) {
    children.push(el('div', { class: 'liked-badge' }, icon('heart', { size: 12, filled: true })));
  }
  return el('button', {
    class: 'product-card',
    onclick: () => { state.selectedProductId = product.id; state.showHistory = false; renderOverlay(); },
  }, children);
}

function renderMain() {
  const searching = state.filters.search.trim().length > 0;
  const crossMode = searching || state.showMustBuyOnly || state.showLikedOnly;
  const cat = state.data.categories.find((c) => c.id === state.activeCategoryId);
  const subcatOptions = cat ? cat.subcategories : [];
  const customFields = (cat && cat.customFields) || [];
  const categoryProducts = state.data.products.filter((p) => p.categoryId === state.activeCategoryId);
  const brandOptions = Array.from(new Set(categoryProducts.map((p) => p.brand))).sort();

  /* 次分類篩選選項：只列出「目前這個分類裡還有商品在用」的次分類，用不到的不會出現在篩選裡 */
  const usedSubcats = Array.from(new Set(categoryProducts.map((p) => p.subcategory).filter(Boolean)));
  const subcatFilterOptions = subcatOptions.filter((s) => usedSubcats.indexOf(s) !== -1)
    .concat(usedSubcats.filter((s) => subcatOptions.indexOf(s) === -1));

  /* 可篩選的自訂欄位：同樣只列出目前分類裡實際有填值的選項 */
  const filterableFields = customFields.filter((f) => f.filterable).map((f) => {
    const values = Array.from(new Set(categoryProducts.map((p) => (p.customValues || {})[f.id]).filter(Boolean)));
    return { field: f, values };
  }).filter((x) => x.values.length > 0);

  let filtered;
  if (searching) {
    const q = state.filters.search.trim().toLowerCase();
    filtered = state.data.products.filter((p) => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q));
  } else if (state.showMustBuyOnly) {
    filtered = state.data.products.filter((p) => p.mustBuy);
  } else if (state.showLikedOnly) {
    filtered = state.data.products.filter((p) => p.liked);
  } else {
    filtered = categoryProducts.filter((p) => {
      if (state.filters.subcategory !== 'all' && p.subcategory !== state.filters.subcategory) return false;
      if (state.filters.brand !== 'all' && p.brand !== state.filters.brand) return false;
      for (const { field } of filterableFields) {
        const wanted = state.filters.custom[field.id];
        if (wanted && wanted !== 'all' && (p.customValues || {})[field.id] !== wanted) return false;
      }
      return true;
    });
  }

  /* filter row：跨分類模式（搜尋／必買清單）時隱藏，因為這些下拉是綁在目前分類的 */
  refs.filterRowContainer.innerHTML = '';
  refs.filterRowContainer.style.display = crossMode ? 'none' : '';
  if (!crossMode) {
    const subSelect = el('select', {
      class: 'filter-select',
      onchange: (e) => { state.filters.subcategory = e.target.value; renderMain(); },
    }, [el('option', { value: 'all' }, '全部次分類')].concat(subcatFilterOptions.map((s) => el('option', { value: s }, s))));
    subSelect.value = state.filters.subcategory;
    const brandSelect = el('select', {
      class: 'filter-select',
      onchange: (e) => { state.filters.brand = e.target.value; renderMain(); },
    }, [el('option', { value: 'all' }, '全部品牌')].concat(brandOptions.map((b) => el('option', { value: b }, b))));
    brandSelect.value = state.filters.brand;
    refs.filterRowContainer.appendChild(subSelect);
    refs.filterRowContainer.appendChild(brandSelect);
    filterableFields.forEach(({ field, values }) => {
      const sel = el('select', {
        class: 'filter-select',
        onchange: (e) => { state.filters.custom[field.id] = e.target.value; renderMain(); },
      }, [el('option', { value: 'all' }, `全部${field.label}`)].concat(values.map((v) => el('option', { value: v }, v))));
      sel.value = state.filters.custom[field.id] || 'all';
      refs.filterRowContainer.appendChild(sel);
    });
  }
  const sortSelect = el('select', {
    class: 'filter-select',
    onchange: (e) => { state.filters.sort = e.target.value; renderMain(); },
  }, [
    el('option', { value: 'default' }, '預設順序'),
    el('option', { value: 'priceAsc' }, '價格由低到高'),
    el('option', { value: 'updated' }, '最近更新優先'),
  ]);
  sortSelect.value = state.filters.sort;
  refs.filterRowContainer.appendChild(sortSelect);

  /* 分組：跨分類模式（搜尋／必買清單）依「大分類」分組，平常依「次分類」分組（僅目前分類） */
  refs.main.innerHTML = '';
  let groups;
  if (crossMode) {
    const byCat = {};
    filtered.forEach((p) => {
      const c = state.data.categories.find((cc) => cc.id === p.categoryId);
      const k = c ? c.name : '未分類';
      (byCat[k] = byCat[k] || []).push(p);
    });
    groups = Object.keys(byCat).map((k) => ({ name: k, items: byCat[k], addable: false }));
    if (searching) {
      refs.main.appendChild(el('p', { class: 'text-xs text-faint mb3' }, `「${state.filters.search.trim()}」的搜尋結果（跨全部分類） · 共 ${filtered.length} 件`));
    } else if (state.showMustBuyOnly) {
      refs.main.appendChild(el('div', { class: 'flex items-center gap-2 mb3' }, [
        icon('star', { size: 15, filled: true, class: 'text-orange-600' }),
        el('span', { class: 'text-xs text-faint' }, `必買清單（跨全部分類） · 共 ${filtered.length} 件`),
      ]));
    } else {
      refs.main.appendChild(el('div', { class: 'flex items-center gap-2 mb3' }, [
        icon('heart', { size: 15, filled: true, class: 'text-rose-600' }),
        el('span', { class: 'text-xs text-faint' }, `用過喜歡清單（跨全部分類） · 共 ${filtered.length} 件`),
      ]));
    }
  } else {
    const bySub = {};
    filtered.forEach((p) => { const k = p.subcategory || '未分類'; (bySub[k] = bySub[k] || []).push(p); });
    const orderedKeys = subcatOptions.concat(Object.keys(bySub).filter((k) => subcatOptions.indexOf(k) === -1));
    groups = orderedKeys.filter((k) => bySub[k] && bySub[k].length > 0).map((k) => ({ name: k, items: bySub[k], addable: true }));
  }

  if (!crossMode && state.filters.sort !== 'default') {
    groups.forEach((g) => {
      if (state.filters.sort === 'priceAsc') {
        g.items = g.items.slice().sort((a, b) => {
          const pa = getBestActivePrice(a.id); const pb = getBestActivePrice(b.id);
          const va = pa ? (pa.approxTwd != null ? pa.approxTwd : pa.price) : Infinity;
          const vb = pb ? (pb.approxTwd != null ? pb.approxTwd : pb.price) : Infinity;
          return va - vb;
        });
      } else if (state.filters.sort === 'updated') {
        g.items = g.items.slice().sort((a, b) => {
          const da = getLatestActiveDate(a.id); const db = getLatestActiveDate(b.id);
          return (db ? new Date(db).getTime() : 0) - (da ? new Date(da).getTime() : 0);
        });
      }
    });
  }

  if (groups.length === 0) {
    let emptyMsg = '這個分類目前沒有符合條件的商品';
    if (searching) emptyMsg = '找不到符合的商品';
    else if (state.showMustBuyOnly) emptyMsg = '目前沒有標記「必買」的商品';
    else if (state.showLikedOnly) emptyMsg = '目前沒有標記「用過喜歡」的商品';
    refs.main.appendChild(el('div', { class: 'empty-state' }, [
      icon(state.showMustBuyOnly ? 'star' : (state.showLikedOnly ? 'heart' : 'tag'), { size: 28, class: 'text-orange-200' }),
      el('p', { class: 'text-sm mt2' }, emptyMsg),
      !crossMode ? el('button', {
        class: 'text-orange-600 text-sm font-medium underline mt2',
        onclick: () => { state.addProductPreset = {}; renderOverlay(); },
      }, '新增第一筆商品') : null,
    ]));
    return;
  }
  groups.forEach((g) => {
    const headerChildren = [
      el('div', { class: 'section-title-wrap' }, [
        el('h3', { class: 'section-title font-display' }, g.name),
        el('span', { class: 'section-count' }, `${g.items.length} 件`),
      ]),
    ];
    if (g.addable) {
      headerChildren.push(el('button', {
        class: 'section-add-btn',
        onclick: () => { state.addProductPreset = { subcategory: g.name }; renderOverlay(); },
      }, icon('plus', { size: 15 })));
    }
    const sectionHeader = el('div', { class: 'section-header' }, headerChildren);
    const list = el('div', { class: 'product-list' }, g.items.map(buildProductCard));
    refs.main.appendChild(el('div', { class: 'section' }, [sectionHeader, list]));
  });
}

/* ---------------- 價格列（drawer 內共用） ---------------- */
function buildPriceRow(record, opts) {
  const rates = state.data.exchangeRates;
  const approx = record.currency !== 'TWD' && rates[record.currency] ? record.price / rates[record.currency] : null;
  const unitPrice = getUnitPrice(record, opts.productSpec, rates);
  const typeLabel = { original: '定價', sale: '特價', bundle: '組合價' }[record.priceType];
  const typeClass = { original: 'tag-chip', sale: 'tag-chip sale', bundle: 'tag-chip bundle' }[record.priceType];
  const capacityLabel = record.capacity || opts.productSpec;

  const top = el('div', { class: 'price-row-top' }, [
    el('span', { class: 'price-row-store' }, record.store),
    el('span', { class: 'price-row-country' }, record.country),
    el('span', { class: typeClass }, typeLabel),
  ]);
  if (opts.isBestTotal) top.appendChild(el('span', { class: 'badge-best' }, '最低價'));
  if (opts.isBestUnit && !opts.isBestTotal) top.appendChild(el('span', { class: 'badge-unit-best' }, '單位最划算'));

  const mainCol = el('div', { class: 'price-row-main' }, [top]);
  if (capacityLabel) mainCol.appendChild(el('div', { class: 'price-row-sub' }, `容量：${capacityLabel}`));
  if (record.bundleNote) mainCol.appendChild(el('div', { class: 'price-row-sub' }, `備註：${record.bundleNote}`));
  mainCol.appendChild(el('div', { class: 'price-row-date' }, formatDate(record.datetime)));
  const linkRow = el('div', { class: 'flex gap-3', style: { flexWrap: 'wrap' } });
  if (opts.onToggleStatus) linkRow.appendChild(el('button', { class: 'toggle-link', onclick: opts.onToggleStatus }, opts.actionLabel));
  if (opts.onEdit) linkRow.appendChild(el('button', { class: 'toggle-link', onclick: opts.onEdit }, '編輯'));
  if (opts.onDelete) linkRow.appendChild(el('button', { class: 'toggle-link', style: { color: '#e11d48' }, onclick: opts.onDelete }, '刪除'));
  if (linkRow.children.length > 0) mainCol.appendChild(linkRow);

  const amountCol = el('div', { class: 'price-row-amount' }, [
    el('div', { class: 'price-amount tabular' + (opts.isBestTotal ? ' best' : '') }, `${record.currency} ${record.price.toLocaleString()}`),
  ]);
  if (approx != null) amountCol.appendChild(el('div', { class: 'price-approx tabular' }, `≈NT$${Math.round(approx).toLocaleString()}`));
  if (unitPrice) {
    amountCol.appendChild(el('div', { class: 'price-unit tabular' + (opts.isBestUnit ? ' best' : '') }, `每${unitPrice.unit} NT$${unitPrice.value.toFixed(1)}`));
  }

  return el('div', { class: 'price-row' + (opts.isBestTotal ? ' best' : '') }, [mainCol, amountCol]);
}

/* ---------------- 商品詳情抽屜 ---------------- */
function buildDrawer(product) {
  const category = state.data.categories.find((c) => c.id === product.categoryId);
  const records = state.data.priceRecords.filter((r) => r.productId === product.id);
  const active = records.filter((r) => r.status === 'active');
  const history = records.filter((r) => r.status === 'expired');
  const rates = state.data.exchangeRates;

  const withMetrics = active.map((r) => Object.assign({}, r, {
    approxTwd: toTwd(r.currency, r.price, rates),
    unitPrice: getUnitPrice(r, product.spec, rates),
  }));
  const withTwd = withMetrics.slice().sort((a, b) => (a.approxTwd ?? Infinity) - (b.approxTwd ?? Infinity));
  const bestTotalId = withTwd[0] ? withTwd[0].id : null;
  const unitComparable = withMetrics.filter((r) => r.unitPrice);
  const bestUnitId = unitComparable.length > 0
    ? unitComparable.reduce((a, b) => (a.unitPrice.value <= b.unitPrice.value ? a : b)).id
    : null;
  const sortedHistory = history.slice().sort((a, b) => new Date(b.datetime) - new Date(a.datetime));

  const mustBuyToggle = el('button', {
    class: 'icon-btn' + (product.mustBuy ? ' active-star' : ''), style: { width: '32px', height: '32px' },
    title: product.mustBuy ? '取消必買標記' : '設為這次必買',
    onclick: () => {
      state.data.products = state.data.products.map((p) => (p.id === product.id ? Object.assign({}, p, { mustBuy: !p.mustBuy }) : p));
      persistData();
      renderOverlay();
      renderMain();
    },
  }, icon('star', { size: 17, filled: product.mustBuy }));
  const likedToggle = el('button', {
    class: 'icon-btn' + (product.liked ? ' active-heart' : ''), style: { width: '32px', height: '32px' },
    title: product.liked ? '取消用過喜歡標記' : '標記為用過喜歡',
    onclick: () => {
      state.data.products = state.data.products.map((p) => (p.id === product.id ? Object.assign({}, p, { liked: !p.liked }) : p));
      persistData();
      renderOverlay();
      renderMain();
    },
  }, icon('heart', { size: 17, filled: product.liked }));
  const drawerHeader = el('div', { class: 'drawer-header' }, [
    el('div', { class: 'text-xs text-faint' }, `${category ? category.name : ''} · ${product.subcategory}`),
    el('div', { class: 'flex gap-2' }, [
      mustBuyToggle,
      likedToggle,
      el('button', { class: 'icon-btn', style: { width: '32px', height: '32px' }, onclick: closeOverlayLayer('drawer') }, icon('x', { size: 18 })),
    ]),
  ]);

  const body = el('div', { class: 'drawer-body' });
  body.appendChild(el('div', { class: 'drawer-image' },
    product.imageUrl ? el('img', { src: product.imageUrl, alt: product.name }) : icon('tag', { size: 32, class: 'text-orange-200' })
  ));
  body.appendChild(el('div', { class: 'drawer-brand' }, product.brand));
  body.appendChild(el('h2', { class: 'drawer-title' }, product.name));
  body.appendChild(el('div', { class: 'drawer-spec' }, `商品規格：${product.spec}`));
  const statusChips = [];
  if (product.mustBuy) statusChips.push(el('span', { class: 'must-buy-chip' }, [icon('star', { size: 12, filled: true }), '這次必買']));
  if (product.liked) statusChips.push(el('span', { class: 'liked-chip' }, [icon('heart', { size: 12, filled: true }), '用過喜歡']));
  if (statusChips.length > 0) body.appendChild(el('div', { class: 'flex gap-2', style: { flexWrap: 'wrap' } }, statusChips));
  const customFieldDefs = (category && category.customFields) || [];
  const customValues = product.customValues || {};
  const filledCustom = customFieldDefs.filter((f) => customValues[f.id]);
  if (filledCustom.length > 0) {
    body.appendChild(el('div', { class: 'flex gap-2', style: { flexWrap: 'wrap', marginTop: '8px' } },
      filledCustom.map((f) => el('span', { class: 'tag-chip' }, `${f.label}：${customValues[f.id]}`))
    ));
  }
  if (product.note) body.appendChild(el('p', { class: 'drawer-note' }, product.note));

  const actions = el('div', { class: 'drawer-actions' }, [
    el('button', {
      class: 'btn btn-primary', style: { flex: '1' },
      onclick: () => { state.showAddPriceFor = { productId: product.id }; renderOverlay(); },
    }, [icon('plus', { size: 15 }), '新增價格']),
    el('button', {
      class: 'btn btn-outline',
      onclick: () => { state.addProductPreset = { editProduct: product }; renderOverlay(); },
    }, '編輯'),
    el('button', { class: 'btn btn-danger-outline', onclick: () => {
      const removedProduct = product;
      const removedRecords = state.data.priceRecords.filter((r) => r.productId === product.id);
      state.data.products = state.data.products.filter((p) => p.id !== product.id);
      state.data.priceRecords = state.data.priceRecords.filter((r) => r.productId !== product.id);
      const recycleEntry = moveToRecycle({ type: 'product', product: removedProduct, priceRecords: removedRecords });
      persistData();
      state.selectedProductId = null;
      renderOverlay();
      renderCategoryTabs();
      renderMain();
      showToast('已刪除商品，30 天內可從設定的回收桶復原', {
        label: '復原',
        onClick: () => { restoreRecycleEntry(recycleEntry.id); showToast('已復原'); },
      });
    } }, icon('trash', { size: 16 })),
  ]);
  body.appendChild(actions);
  if (product.productUrl) {
    body.appendChild(el('button', {
      class: 'btn btn-outline', style: { width: '100%', marginTop: '8px', color: '#ea580c', borderColor: '#fed7aa' },
      onclick: () => window.open(product.productUrl, '_blank'),
    }, [icon('external', { size: 15 }), '前往官網查看']));
  }

  const priceSection = el('div', { class: 'mt6' }, [
    el('div', { class: 'section-header', style: { marginBottom: '8px' } }, [
      el('h3', { class: 'font-display text-base' }, '目前有效比價'),
      el('span', { class: 'text-xs text-faint' }, `${active.length} 筆`),
    ]),
  ]);
  if (unitComparable.length >= 2) {
    priceSection.appendChild(el('p', { class: 'hint-box' }, '已依容量換算出「每單位」價格，方便比較不同容量規格 — 綠色標示為換算後最划算的選擇。'));
  }
  if (withTwd.length === 0) {
    priceSection.appendChild(el('p', { class: 'text-sm text-faint text-center py3', style: { border: '1px dashed #ffedd5', borderRadius: '18px' } }, '尚無有效價格紀錄'));
  } else {
    priceSection.appendChild(el('div', { class: 'price-list' }, withTwd.map((r) => buildPriceRow(r, {
      productSpec: product.spec,
      isBestTotal: r.id === bestTotalId,
      isBestUnit: r.id === bestUnitId,
      onToggleStatus: () => { toggleRecordStatus(r.id); renderOverlay(); },
      actionLabel: '標記為已漲價／失效',
      onEdit: () => { state.showAddPriceFor = { productId: product.id, editRecord: r }; renderOverlay(); },
      onDelete: () => { deletePriceRecord(r.id, product.id); },
    }))));
  }
  body.appendChild(priceSection);

  const historyToggleBtn = el('button', { class: 'history-toggle' }, [
    icon('history', { size: 15 }),
    el('span', {}, state.showHistory ? '隱藏歷史價格紀錄' : `顯示歷史價格紀錄 (${history.length})`),
  ]);
  historyToggleBtn.addEventListener('click', () => { state.showHistory = !state.showHistory; renderOverlay(); });
  const historyWrap = el('div', { class: 'mt3' }, [historyToggleBtn]);
  if (state.showHistory) {
    if (sortedHistory.length === 0) {
      historyWrap.appendChild(el('p', { class: 'text-sm text-faint text-center py3' }, '尚無歷史紀錄'));
    } else {
      historyWrap.appendChild(el('div', { class: 'history-list' }, sortedHistory.map((r) => el('div', { class: 'opacity-75' }, buildPriceRow(r, {
        productSpec: product.spec, isBestTotal: false, isBestUnit: false,
        onToggleStatus: () => { toggleRecordStatus(r.id); renderOverlay(); },
        actionLabel: '恢復為有效價格',
        onEdit: () => { state.showAddPriceFor = { productId: product.id, editRecord: r }; renderOverlay(); },
        onDelete: () => { deletePriceRecord(r.id, product.id); },
      })))));
    }
  }
  body.appendChild(historyWrap);

  return el('div', { class: 'drawer' }, [drawerHeader, body]);
}

function toggleRecordStatus(recordId) {
  state.data.priceRecords = state.data.priceRecords.map((r) => (r.id === recordId ? Object.assign({}, r, { status: r.status === 'active' ? 'expired' : 'active' }) : r));
  persistData();
  renderMain();
}

function deletePriceRecord(recordId, productId) {
  const removed = state.data.priceRecords.find((r) => r.id === recordId);
  if (!removed) return;
  state.data.priceRecords = state.data.priceRecords.filter((r) => r.id !== recordId);
  const recycleEntry = moveToRecycle({ type: 'priceRecord', record: removed, productId });
  persistData();
  renderOverlay();
  renderMain();
  showToast('已刪除這筆價格紀錄', {
    label: '復原',
    onClick: () => { restoreRecycleEntry(recycleEntry.id); showToast('已復原'); },
  });
}

/* ---------------- 表單小工具 ---------------- */
function field(labelText, inputNode) {
  return el('div', { class: 'field' }, [el('label', { class: 'field-label' }, labelText), inputNode]);
}
function closeOverlayLayer(which) {
  return () => {
    if (which === 'drawer') state.selectedProductId = null;
    if (which === 'addProduct') state.addProductPreset = null;
    if (which === 'addPrice') state.showAddPriceFor = null;
    if (which === 'settings') state.showSettings = false;
    renderOverlay();
  };
}

/* ---------------- 新增商品 Modal ---------------- */
function buildAddProductModal(preset) {
  const editingProduct = preset.editProduct || null;
  const categories = state.data.categories;
  const modalUid = uid();
  let categoryId = editingProduct ? editingProduct.categoryId : (state.activeCategoryId || (categories[0] && categories[0].id));
  const subcatInput = el('input', { class: 'field-input', placeholder: '例如：化妝水（可自行輸入新項目）', list: 'subcat-options-list-' + modalUid });
  subcatInput.value = editingProduct ? editingProduct.subcategory : (preset.subcategory || '');
  const subDatalist = el('datalist', { id: 'subcat-options-list-' + modalUid });

  const brandInput = el('input', { class: 'field-input', required: 'required', list: 'brand-options-list-' + modalUid });
  const brandDatalist = el('datalist', { id: 'brand-options-list-' + modalUid });

  const customFieldsContainer = el('div', {});
  let customInputs = {};

  function refreshCategoryDependentUI() {
    subDatalist.innerHTML = '';
    const cat = categories.find((c) => c.id === categoryId);
    (cat ? cat.subcategories : []).forEach((s) => subDatalist.appendChild(el('option', { value: s })));

    brandDatalist.innerHTML = '';
    const brandsInCat = Array.from(new Set(state.data.products.filter((p) => p.categoryId === categoryId).map((p) => p.brand))).sort();
    brandsInCat.forEach((b) => brandDatalist.appendChild(el('option', { value: b })));

    customFieldsContainer.innerHTML = '';
    customInputs = {};
    const fields = (cat && cat.customFields) || [];
    fields.forEach((f) => {
      const input = el('input', { class: 'field-input' });
      if (editingProduct && editingProduct.categoryId === categoryId) {
        input.value = (editingProduct.customValues || {})[f.id] || '';
      }
      customInputs[f.id] = input;
      customFieldsContainer.appendChild(field(f.label + '（選填）', input));
    });
  }
  refreshCategoryDependentUI();

  const categorySelect = el('select', {
    class: 'field-input',
    onchange: (e) => { categoryId = e.target.value; refreshCategoryDependentUI(); },
  }, categories.map((c) => el('option', { value: c.id }, c.name)));
  categorySelect.value = categoryId;

  const specInput = el('input', { class: 'field-input', placeholder: '例如：230ml' });
  const nameInput = el('input', { class: 'field-input', required: 'required' });
  const productUrlInput = el('input', { class: 'field-input', placeholder: 'https://...' });
  const noteInput = el('textarea', { class: 'field-input', rows: 2 });

  /* 商品圖片：可直接從相簿上傳照片，也可以貼網址 */
  const imageInput = el('input', { class: 'field-input', placeholder: '或貼上圖片網址 https://...' });
  const imagePreview = el('img', { style: { width: '56px', height: '56px', objectFit: 'cover', borderRadius: '12px', display: 'none' } });
  const fileInput = el('input', { type: 'file', accept: 'image/*', class: 'hidden' });
  function updateImagePreview() {
    if (imageInput.value) { imagePreview.src = imageInput.value; imagePreview.style.display = 'block'; }
    else { imagePreview.style.display = 'none'; }
  }
  const uploadBtn = el('button', { type: 'button', class: 'btn btn-outline', onclick: () => fileInput.click() }, '上傳照片');
  const removeImgBtn = el('button', { type: 'button', class: 'text-xs text-faint', style: { textDecoration: 'underline' }, onclick: () => { imageInput.value = ''; updateImagePreview(); } }, '清除圖片');
  fileInput.addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    uploadBtn.disabled = true;
    uploadBtn.textContent = '處理中...';
    try {
      const dataUrl = await compressImageFile(f);
      imageInput.value = dataUrl;
      updateImagePreview();
    } catch (err) {
      showToast('這張照片讀取失敗，換一張試試');
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.textContent = '上傳照片';
      e.target.value = '';
    }
  });
  imageInput.addEventListener('input', updateImagePreview);

  if (editingProduct) {
    brandInput.value = editingProduct.brand;
    specInput.value = editingProduct.spec || '';
    nameInput.value = editingProduct.name;
    imageInput.value = editingProduct.imageUrl || '';
    productUrlInput.value = editingProduct.productUrl || '';
    noteInput.value = editingProduct.note || '';
  }
  updateImagePreview();

  const form = el('form', {
    onsubmit: (e) => {
      e.preventDefault();
      if (!brandInput.value.trim() || !nameInput.value.trim()) return;
      const subcategory = subcatInput.value.trim();
      state.data.categories = state.data.categories.map((c) => {
        if (c.id === categoryId && subcategory && c.subcategories.indexOf(subcategory) === -1) {
          return Object.assign({}, c, { subcategories: c.subcategories.concat([subcategory]) });
        }
        return c;
      });
      const customValues = {};
      Object.keys(customInputs).forEach((fid) => {
        const v = customInputs[fid].value.trim();
        if (v) customValues[fid] = v;
      });
      const payload = {
        categoryId, subcategory, brand: brandInput.value.trim(), name: nameInput.value.trim(),
        spec: specInput.value.trim(), note: noteInput.value.trim(), imageUrl: imageInput.value.trim(),
        productUrl: productUrlInput.value.trim(), customValues,
      };
      if (editingProduct) {
        state.data.products = state.data.products.map((p) => (p.id === editingProduct.id ? Object.assign({}, p, payload) : p));
        showToast('已更新商品');
      } else {
        payload.id = 'prod-' + uid();
        state.data.products.push(payload);
        showToast('已新增商品');
      }
      state.activeCategoryId = categoryId;
      persistData();
      state.addProductPreset = null;
      renderOverlay();
      renderCategoryTabs();
      renderMain();
    },
  }, [
    field('大分類', categorySelect),
    field('次分類/細項', subcatInput),
    subDatalist,
    el('div', { class: 'field-row' }, [field('品牌', brandInput), field('規格/容量（預設，例如 230ml）', specInput)]),
    brandDatalist,
    field('商品名稱', nameInput),
    field('商品圖片（選填）', el('div', {}, [
      el('div', { class: 'flex items-center gap-3 mb2' }, [imagePreview, uploadBtn, removeImgBtn]),
      imageInput,
      fileInput,
    ])),
    field('商品連結（選填，方便之後快速前往官網比對，不會自動抓價）', productUrlInput),
    field('備註/介紹描述', noteInput),
    customFieldsContainer,
    el('button', { type: 'submit', class: 'submit-btn' }, editingProduct ? '儲存修改' : '新增商品'),
  ]);

  return buildModalShell(editingProduct ? '編輯商品' : '新增商品', closeOverlayLayer('addProduct'), form, false);
}

/* ---------------- 新增價格 Modal ---------------- */
function buildAddPriceModal(productId, editRecord) {
  const modalUid = uid();
  const knownCountries = Array.from(new Set(state.data.priceRecords.map((r) => r.country).filter(Boolean)));
  const knownStores = Array.from(new Set(state.data.priceRecords.map((r) => r.store).filter(Boolean)));
  const countryInput = el('input', { class: 'field-input', placeholder: '例如：韓國（可自行輸入新項目）', required: 'required', list: 'country-options-' + modalUid });
  const countryDatalist = el('datalist', { id: 'country-options-' + modalUid }, knownCountries.map((c) => el('option', { value: c })));
  const currencySelect = el('select', { class: 'field-input' }, CURRENCIES.map((c) => el('option', { value: c }, c)));
  const storeInput = el('input', { class: 'field-input', placeholder: '例如：Olive Young 明洞店（可自行輸入新項目）', required: 'required', list: 'store-options-' + modalUid });
  const storeDatalist = el('datalist', { id: 'store-options-' + modalUid }, knownStores.map((s) => el('option', { value: s })));
  const capacityInput = el('input', { class: 'field-input', placeholder: '例如：500ml（用於換算每單位價格）' });
  const datetimeInput = el('input', { class: 'field-input', type: 'datetime-local' });
  datetimeInput.value = nowLocalInput();
  const priceInput = el('input', { class: 'field-input tabular', type: 'number', step: '0.01', required: 'required' });
  const bundleNoteInput = el('input', { class: 'field-input', placeholder: '例如：1+1 或加贈小樣' });

  let priceType = 'original';
  const typeButtons = {};
  const bundleField = field('組合備註', bundleNoteInput);
  bundleField.style.display = 'none';
  function setPriceType(v) {
    priceType = v;
    Object.keys(typeButtons).forEach((k) => typeButtons[k].classList.toggle('active', k === v));
    bundleField.style.display = v === 'bundle' ? '' : 'none';
  }
  const typeRow = el('div', { class: 'type-toggle-row' }, [['original', '定價'], ['sale', '特價'], ['bundle', '組合價']].map(([v, l]) => {
    const btn = el('button', { type: 'button', class: 'type-toggle-btn' + (v === 'original' ? ' active' : ''), onclick: () => setPriceType(v) }, l);
    typeButtons[v] = btn;
    return btn;
  }));

  if (editRecord) {
    countryInput.value = editRecord.country;
    currencySelect.value = editRecord.currency;
    storeInput.value = editRecord.store;
    capacityInput.value = editRecord.capacity || '';
    datetimeInput.value = (function () {
      const d = new Date(editRecord.datetime);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    })();
    priceInput.value = editRecord.price;
    bundleNoteInput.value = editRecord.bundleNote || '';
    setPriceType(editRecord.priceType);
  }

  const form = el('form', {
    onsubmit: (e) => {
      e.preventDefault();
      const p = parseFloat(priceInput.value);
      if (!countryInput.value.trim() || !storeInput.value.trim() || isNaN(p)) return;
      const payload = {
        country: countryInput.value.trim(), currency: currencySelect.value, store: storeInput.value.trim(),
        datetime: new Date(datetimeInput.value).toISOString(),
        priceType, price: p, bundleNote: priceType === 'bundle' ? bundleNoteInput.value.trim() : '',
        capacity: capacityInput.value.trim(),
      };
      if (editRecord) {
        state.data.priceRecords = state.data.priceRecords.map((r) => (r.id === editRecord.id ? Object.assign({}, r, payload) : r));
        showToast('已更新價格紀錄');
      } else {
        payload.id = 'pr-' + uid();
        payload.productId = productId;
        payload.status = 'active';
        state.data.priceRecords.push(payload);
        showToast('已新增價格紀錄');
      }
      persistData();
      state.showAddPriceFor = null;
      renderOverlay();
      renderMain();
    },
  }, [
    el('div', { class: 'field-row' }, [field('購買國家/地區', countryInput), field('幣別', currencySelect)]),
    countryDatalist,
    field('通路/店家名稱', storeInput),
    storeDatalist,
    field('這次購買的容量（選填，留空則套用商品預設規格）', capacityInput),
    field('紀錄日期時間', datetimeInput),
    field('價格型態', typeRow),
    bundleField,
    field('價格金額', priceInput),
    el('button', { type: 'submit', class: 'submit-btn' }, editRecord ? '儲存修改' : '儲存紀錄'),
  ]);

  return buildModalShell(editRecord ? '編輯價格紀錄' : '新增價格紀錄', closeOverlayLayer('addPrice'), form, false);
}

/* ---------------- 設定 Modal ---------------- */
function buildSettingsModal() {
  const rates = state.data.exchangeRates;
  const rateInputs = {};
  const rateFields = ['KRW', 'JPY', 'USD', 'CNY', 'EUR', 'HKD'].map((cur) => {
    const input = el('input', { class: 'field-input tabular', type: 'number', step: '0.0001' });
    input.value = rates[cur] != null ? rates[cur] : '';
    rateInputs[cur] = input;
    return field(`1 TWD = ? ${cur}`, input);
  });

  const saveBtn = el('button', {
    class: 'btn btn-primary', style: { marginTop: '16px' },
    onclick: () => {
      const parsed = {};
      Object.keys(rateInputs).forEach((k) => { const n = parseFloat(rateInputs[k].value); if (!isNaN(n) && n > 0) parsed[k] = n; });
      state.data.exchangeRates = parsed;
      persistData();
      renderMain();
      showToast('匯率已更新');
    },
  }, '儲存匯率設定');

  const liveStatus = el('span', { class: 'text-xs text-faint', style: { marginLeft: '10px' } }, '');
  const liveBtn = el('button', {
    class: 'btn btn-outline', style: { marginTop: '16px', marginLeft: '8px' },
    onclick: async () => {
      liveBtn.disabled = true;
      liveBtn.textContent = '抓取中...';
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/TWD');
        if (!res.ok) throw new Error('network');
        const json = await res.json();
        if (json.result !== 'success' || !json.rates) throw new Error('api');
        Object.keys(rateInputs).forEach((k) => {
          if (json.rates[k] != null) rateInputs[k].value = Number(json.rates[k]).toFixed(4);
        });
        liveStatus.textContent = json.time_last_update_utc ? `更新於 ${json.time_last_update_utc}` : '已抓取最新匯率';
        showToast('已抓取即時匯率，記得按「儲存匯率設定」');
      } catch (err) {
        showToast('抓取即時匯率失敗，請檢查網路連線');
      } finally {
        liveBtn.disabled = false;
        liveBtn.textContent = '更新即時匯率';
      }
    },
  }, '更新即時匯率');

  /* ---- 分類管理：可以刪除不需要的大分類（連同裡面的商品一起，會先放回收桶） ---- */
  const categoryManageListContainer = el('div', { class: 'mt2' });
  function refreshCategoryManageList() {
    categoryManageListContainer.innerHTML = '';
    state.data.categories.forEach((c) => {
      const count = state.data.products.filter((p) => p.categoryId === c.id).length;
      categoryManageListContainer.appendChild(el('div', { class: 'flex items-center justify-between', style: { padding: '6px 0', borderBottom: '1px solid #fff7ed' } }, [
        el('span', { class: 'text-sm' }, `${c.name}（${count} 件商品）`),
        el('button', {
          type: 'button', class: 'text-xs text-rose-600', style: { textDecoration: 'underline' },
          onclick: () => {
            if (state.data.categories.length <= 1) { showToast('至少要保留一個分類'); return; }
            const msg = count > 0
              ? `分類「${c.name}」裡有 ${count} 件商品，刪除後連同商品與價格紀錄會一起移到回收桶（30 天內可復原）。確定要刪除嗎？`
              : `確定要刪除分類「${c.name}」嗎？`;
            if (!confirm(msg)) return;
            deleteCategoryWithContents(c.id);
            renderCategoryTabs();
            renderMain();
            renderOverlay();
          },
        }, '刪除'),
      ]));
    });
  }
  refreshCategoryManageList();

  /* ---- 分類欄位設定：幫每個大分類加自訂欄位（例如香水的「香調」） ---- */
  let fieldsCategoryId = (state.data.categories[0] && state.data.categories[0].id) || null;
  const fieldsListContainer = el('div', { class: 'mt2' });
  const newFieldNameInput = el('input', { class: 'field-input', placeholder: '例如：香調 / 適合季節' });
  const newFieldFilterableCheckbox = el('input', { type: 'checkbox' });
  const newFieldShowOnCardCheckbox = el('input', { type: 'checkbox' });

  function refreshFieldsList() {
    fieldsListContainer.innerHTML = '';
    const cat = state.data.categories.find((c) => c.id === fieldsCategoryId);
    const fields = (cat && cat.customFields) || [];
    if (fields.length === 0) {
      fieldsListContainer.appendChild(el('p', { class: 'text-xs text-faint' }, '這個分類目前沒有自訂欄位'));
      return;
    }
    fields.forEach((f) => {
      fieldsListContainer.appendChild(el('div', { class: 'flex items-center justify-between', style: { padding: '6px 0', borderBottom: '1px solid #fff7ed' } }, [
        el('div', {}, [
          el('span', { class: 'text-sm' }, f.label),
          f.filterable ? el('span', { class: 'tag-chip bundle', style: { marginLeft: '8px' } }, '可篩選') : null,
          f.showOnCard ? el('span', { class: 'tag-chip sale', style: { marginLeft: '8px' } }, '顯示在卡片') : null,
        ]),
        el('button', {
          type: 'button', class: 'text-xs text-rose-600', style: { textDecoration: 'underline' },
          onclick: () => {
            state.data.categories = state.data.categories.map((c) => (c.id === fieldsCategoryId
              ? Object.assign({}, c, { customFields: (c.customFields || []).filter((x) => x.id !== f.id) })
              : c));
            persistData();
            refreshFieldsList();
            renderMain();
            showToast('已移除「' + f.label + '」欄位');
          },
        }, '刪除'),
      ]));
    });
  }
  refreshFieldsList();

  const fieldsCategorySelect = el('select', {
    class: 'field-input',
    onchange: (e) => { fieldsCategoryId = e.target.value; refreshFieldsList(); },
  }, state.data.categories.map((c) => el('option', { value: c.id }, c.name)));
  fieldsCategorySelect.value = fieldsCategoryId;

  const addFieldBtn = el('button', {
    type: 'button', class: 'btn btn-outline', style: { marginTop: '10px' },
    onclick: () => {
      const label = newFieldNameInput.value.trim();
      if (!label) return;
      const newField = { id: 'cf-' + uid(), label, filterable: !!newFieldFilterableCheckbox.checked, showOnCard: !!newFieldShowOnCardCheckbox.checked };
      state.data.categories = state.data.categories.map((c) => (c.id === fieldsCategoryId
        ? Object.assign({}, c, { customFields: (c.customFields || []).concat([newField]) })
        : c));
      persistData();
      newFieldNameInput.value = '';
      newFieldFilterableCheckbox.checked = false;
      newFieldShowOnCardCheckbox.checked = false;
      refreshFieldsList();
      renderMain();
      showToast('已新增欄位：' + label);
    },
  }, '新增欄位');

  /* ---- 排序管理：次分類的順序、以及同次分類內商品的順序 ---- */
  /* ---- 儲存空間：讓使用者知道目前大概佔用多少空間，照片跟回收桶是大宗 ---- */
  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }
  function getStorageStats() {
    const totalBytes = new Blob([JSON.stringify(state.data)]).size;
    let photoBytes = 0;
    state.data.products.forEach((p) => { if (p.imageUrl && p.imageUrl.indexOf('data:') === 0) photoBytes += new Blob([p.imageUrl]).size; });
    const recycleBytes = new Blob([JSON.stringify(state.data.recycle || [])]).size;
    return { totalBytes, photoBytes, recycleBytes };
  }
  const storageStatsContainer = el('div', {});
  function refreshStorageStats() {
    storageStatsContainer.innerHTML = '';
    const stats = getStorageStats();
    const near = stats.totalBytes > STORAGE_WARN_BYTES;
    storageStatsContainer.appendChild(el('div', { class: 'cloud-status ' + (near ? 'warn' : 'off') }, [
      el('div', {}, `目前總共約 ${formatBytes(stats.totalBytes)}`),
      el('div', { style: { marginTop: '4px' } }, `其中商品照片約 ${formatBytes(stats.photoBytes)}，回收桶約 ${formatBytes(stats.recycleBytes)}`),
      near ? el('div', { style: { marginTop: '6px', fontWeight: '600' } }, '⚠️ 空間快滿了，建議現在就「匯出 JSON」備份，並清理一些照片或回收桶，避免之後存檔失敗、資料遺失。') : null,
    ]));
  }
  refreshStorageStats();

  let orderCategoryId = (state.data.categories[0] && state.data.categories[0].id) || null;
  let orderSubcat = null;
  const orderSubcatListContainer = el('div', {});
  const orderProductSelectWrap = el('div', {});
  const orderProductListContainer = el('div', {});

  function refreshOrderSubcatList() {
    orderSubcatListContainer.innerHTML = '';
    const cat = state.data.categories.find((c) => c.id === orderCategoryId);
    const subs = (cat && cat.subcategories) || [];
    const usedSubs = subs.filter((s) => state.data.products.some((p) => p.categoryId === orderCategoryId && p.subcategory === s));
    if (usedSubs.length === 0) {
      orderSubcatListContainer.appendChild(el('p', { class: 'text-xs text-faint' }, '這個分類目前還沒有商品，沒有次分類可以排序'));
    } else {
      orderSubcatListContainer.appendChild(buildDragList(
        usedSubs,
        (s) => el('div', { class: 'drag-row-content' }, el('span', { class: 'order-row-title' }, s)),
        (newOrder) => { setSubcategoryOrderAmongUsed(orderCategoryId, usedSubs, newOrder); renderMain(); }
      ));
    }
    refreshOrderProductSelect();
  }

  function refreshOrderProductSelect() {
    orderProductSelectWrap.innerHTML = '';
    const cat = state.data.categories.find((c) => c.id === orderCategoryId);
    const subs = (cat && cat.subcategories) || [];
    const usedSubs = subs.filter((s) => state.data.products.some((p) => p.categoryId === orderCategoryId && p.subcategory === s));
    if (usedSubs.length === 0) { orderProductListContainer.innerHTML = ''; return; }
    if (!orderSubcat || usedSubs.indexOf(orderSubcat) === -1) orderSubcat = usedSubs[0];
    const sel = el('select', {
      class: 'field-input',
      onchange: (e) => { orderSubcat = e.target.value; refreshOrderProductList(); },
    }, usedSubs.map((s) => el('option', { value: s }, s)));
    sel.value = orderSubcat;
    orderProductSelectWrap.appendChild(field('選擇次分類來排序裡面的商品', sel));
    refreshOrderProductList();
  }

  function refreshOrderProductList() {
    orderProductListContainer.innerHTML = '';
    if (!orderSubcat) return;
    const items = state.data.products.filter((p) => p.categoryId === orderCategoryId && p.subcategory === orderSubcat);
    if (items.length === 0) {
      orderProductListContainer.appendChild(el('p', { class: 'text-xs text-faint' }, '這個次分類目前沒有商品'));
      return;
    }
    const ids = items.map((p) => p.id);
    orderProductListContainer.appendChild(buildDragList(
      ids,
      (id) => {
        const p = items.find((x) => x.id === id);
        return el('div', { class: 'drag-row-content' }, el('span', { class: 'order-row-title' }, `${p.brand} · ${p.name}`));
      },
      (newOrder) => { setProductOrderWithinSubcategory(orderCategoryId, orderSubcat, newOrder); renderMain(); }
    ));
  }
  refreshOrderSubcatList();

  const orderCategorySelect = el('select', {
    class: 'field-input',
    onchange: (e) => { orderCategoryId = e.target.value; orderSubcat = null; refreshOrderSubcatList(); },
  }, state.data.categories.map((c) => el('option', { value: c.id }, c.name)));
  orderCategorySelect.value = orderCategoryId;

  /* ---- 回收桶：被刪除的商品／價格紀錄，30 天內可以復原 ---- */
  const recycleListContainer = el('div', {});
  function refreshRecycleList() {
    recycleListContainer.innerHTML = '';
    const entries = (state.data.recycle || []).slice().sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt));
    if (entries.length === 0) {
      recycleListContainer.appendChild(el('p', { class: 'text-xs text-faint' }, '回收桶是空的'));
      return;
    }
    entries.forEach((e) => {
      let title, sub;
      if (e.type === 'category') {
        title = `分類：${e.category.name}`;
        sub = `含 ${(e.products || []).length} 件商品、${(e.priceRecords || []).length} 筆價格紀錄 · ${formatDate(e.deletedAt)} 刪除`;
      } else if (e.type === 'product') {
        title = `${e.product.brand} · ${e.product.name}`;
        sub = `商品（含 ${(e.priceRecords || []).length} 筆價格紀錄） · ${formatDate(e.deletedAt)} 刪除`;
      } else {
        const owner = state.data.products.find((p) => p.id === e.productId);
        title = `${owner ? owner.name : '（原商品已不存在）'} — ${e.record.store} ${e.record.currency} ${e.record.price.toLocaleString()}`;
        sub = `價格紀錄 · ${formatDate(e.deletedAt)} 刪除`;
      }
      recycleListContainer.appendChild(el('div', { class: 'recycle-item' }, [
        el('div', { style: { minWidth: 0 } }, [
          el('div', { class: 'recycle-item-title' }, title),
          el('div', { class: 'recycle-item-sub' }, sub),
        ]),
        el('div', { class: 'recycle-actions' }, [
          el('button', { type: 'button', class: 'text-orange-600', onclick: () => { restoreRecycleEntry(e.id); refreshRecycleList(); refreshStorageStats(); showToast('已復原'); } }, '復原'),
          el('button', { type: 'button', class: 'text-rose-600', onclick: () => {
            if (!confirm('永久刪除後將無法復原，確定嗎？')) return;
            permanentlyDeleteRecycleEntry(e.id);
            refreshRecycleList();
            refreshStorageStats();
          } }, '永久刪除'),
        ]),
      ]));
    });
  }
  refreshRecycleList();

  const emptyRecycleBtn = el('button', {
    type: 'button', class: 'btn btn-outline', style: { marginTop: '10px', color: '#e11d48', borderColor: '#ffedd5' },
    onclick: () => {
      if ((state.data.recycle || []).length === 0) { showToast('回收桶已經是空的'); return; }
      if (!confirm('確定要清空整個回收桶嗎？裡面所有項目將永久刪除，無法復原。')) return;
      state.data.recycle = [];
      persistData();
      refreshRecycleList();
      refreshStorageStats();
      showToast('回收桶已清空');
    },
  }, '立即清空回收桶');

  /* ---- 匯出選項：資料量大時可以選擇不包含照片，備份檔會小很多 ---- */
  const includePhotosCheckbox = el('input', { type: 'checkbox', checked: 'checked' });

  const fileInput = el('input', {
    type: 'file', accept: 'application/json', class: 'hidden',
    onchange: (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      if (!confirm('匯入將取代目前所有資料，確定要繼續嗎？')) { e.target.value = ''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed.categories || !parsed.products || !parsed.priceRecords) { showToast('檔案格式不正確'); return; }
          state.data = { categories: parsed.categories, products: parsed.products, priceRecords: parsed.priceRecords, exchangeRates: parsed.exchangeRates || {}, recycle: parsed.recycle || [] };
          state.activeCategoryId = parsed.categories[0] ? parsed.categories[0].id : null;
          persistData();
          state.showSettings = false;
          renderOverlay();
          renderCategoryTabs();
          renderMain();
          showToast('匯入成功');
        } catch (err) { showToast('匯入失敗，請確認檔案格式'); }
      };
      reader.readAsText(f);
      e.target.value = '';
    },
  });

  const exportBtn = el('button', { class: 'btn btn-outline', style: { flex: '1' }, onclick: () => {
    let exportData = state.data;
    if (!includePhotosCheckbox.checked) {
      exportData = Object.assign({}, state.data, {
        products: state.data.products.map((p) => (p.imageUrl && p.imageUrl.indexOf('data:') === 0 ? Object.assign({}, p, { imageUrl: '' }) : p)),
      });
    }
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: `price-tracker-backup-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已匯出備份檔');
  } }, [icon('download', { size: 15 }), '匯出 JSON']);
  const importBtn = el('button', { class: 'btn btn-outline', style: { flex: '1' }, onclick: () => fileInput.click() }, [icon('upload', { size: 15 }), '匯入 JSON']);

  const body = el('div', { class: 'space-y-7' }, [
    el('div', { class: 'cloud-status ' + (CLOUD_ENABLED ? 'on' : 'off') },
      CLOUD_ENABLED ? '雲端同步已開啟：不同裝置打開會看到同一份資料。' : '目前只存在這台裝置的瀏覽器裡。如需跨裝置同步，請在程式碼最上方設定 CLOUD_ENABLED。'),
    el('div', {}, [
      el('h4', { class: 'font-display text-base mb1' }, '分類管理'),
      el('p', { class: 'text-xs text-faint mb2' }, '可以刪除不需要的分類；刪除後連同裡面的商品、價格紀錄會先放到回收桶，30 天內都能復原。'),
      categoryManageListContainer,
    ]),
    el('div', { class: 'border-t', style: { paddingTop: '24px', borderTop: '1px dashed #fed7aa' } }, [
      el('h4', { class: 'font-display text-base mb1' }, '台幣參考匯率'),
      el('p', { class: 'text-xs text-faint mb2' }, '填寫「1 台幣（TWD）等於多少外幣」，例如 1 TWD = 42 KRW，用於自動換算約略台幣金額。'),
      el('div', { class: 'grid grid-cols-2', style: { gap: '16px' } }, rateFields),
      el('div', { class: 'flex items-center', style: { flexWrap: 'wrap' } }, [saveBtn, liveBtn, liveStatus]),
    ]),
    el('div', { class: 'border-t', style: { paddingTop: '24px', borderTop: '1px dashed #fed7aa' } }, [
      el('h4', { class: 'font-display text-base mb1' }, '分類欄位設定'),
      el('p', { class: 'text-xs text-faint mb2' }, '幫分類加上專屬欄位（例如香水的「香調」、「適合季節」），新增商品時會出現這個欄位；「可用於篩選」會在篩選列多一個下拉；「顯示在卡片」會直接印在主畫面的商品卡片上，不用點進去才看到。'),
      field('選擇分類', fieldsCategorySelect),
      fieldsListContainer,
      el('div', { style: { marginTop: '12px' } }, [newFieldNameInput]),
      el('div', { class: 'flex gap-4', style: { marginTop: '8px' } }, [
        el('label', { class: 'flex items-center gap-2 text-sm' }, [newFieldFilterableCheckbox, '可用於篩選']),
        el('label', { class: 'flex items-center gap-2 text-sm' }, [newFieldShowOnCardCheckbox, '顯示在卡片']),
      ]),
      addFieldBtn,
    ]),
    el('div', { class: 'border-t', style: { paddingTop: '24px', borderTop: '1px dashed #fed7aa' } }, [
      el('h4', { class: 'font-display text-base mb1' }, '排序管理'),
      el('p', { class: 'text-xs text-faint mb2' }, '調整次分類出現的順序，或同一個次分類裡商品的排列順序（就是瀏覽時「排序方式：預設順序」看到的那個順序）。'),
      field('選擇分類', orderCategorySelect),
      el('div', { class: 'mt2' }, [el('div', { class: 'text-xs text-faint mb1' }, '次分類順序'), orderSubcatListContainer]),
      el('div', { class: 'mt3' }, [orderProductSelectWrap, orderProductListContainer]),
    ]),
    el('div', { class: 'border-t', style: { paddingTop: '24px', borderTop: '1px dashed #fed7aa' } }, [
      el('h4', { class: 'font-display text-base mb1' }, '回收桶'),
      el('p', { class: 'text-xs text-faint mb2' }, `被刪除的商品或價格紀錄會先放在這裡 ${RECYCLE_RETENTION_DAYS} 天，超過就會自動清除；也可以在這裡手動「永久刪除」。`),
      recycleListContainer,
      emptyRecycleBtn,
    ]),
    el('div', { class: 'border-t', style: { paddingTop: '24px', borderTop: '1px dashed #fed7aa' } }, [
      el('h4', { class: 'font-display text-base mb1' }, '儲存空間'),
      el('p', { class: 'text-xs text-faint mb2' }, '主要佔空間的是商品照片，其次是回收桶（刪除的商品若有照片，也會先留著）。想省空間可以：少用「上傳照片」多用「貼圖片網址」、或是手動清空回收桶。'),
      storageStatsContainer,
    ]),
    el('div', { class: 'border-t', style: { paddingTop: '24px', borderTop: '1px dashed #fed7aa' } }, [
      el('h4', { class: 'font-display text-base mb1' }, '資料備份'),
      el('p', { class: 'text-xs text-faint mb2' }, '匯出目前所有分類、商品與價格紀錄為 JSON 檔，或從備份檔匯入（將取代目前資料）。'),
      el('label', { class: 'flex items-center gap-2 text-sm mb2' }, [includePhotosCheckbox, '匯出時包含商品照片（取消勾選可以讓備份檔小很多，方便用 Line／信箱傳送）']),
      el('div', { class: 'flex gap-2' }, [exportBtn, importBtn, fileInput]),
    ]),
    el('div', { class: 'text-xs text-faint text-center', style: { paddingTop: '8px' } }, `版本更新於 ${APP_VERSION}`),
  ]);

  return buildModalShell('設定', closeOverlayLayer('settings'), body, true);
}

/* ---------------- Modal 外殼 ---------------- */
function buildModalShell(title, onClose, contentNode, wide) {
  const overlay = el('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) onClose(); } });
  const modal = el('div', { class: 'modal' + (wide ? ' wide' : '') });
  modal.appendChild(el('div', { class: 'accent-rule', style: { borderRadius: '24px 24px 0 0' } }));
  modal.appendChild(el('div', { class: 'modal-header' }, [
    el('h3', { class: 'modal-title' }, title),
    el('button', { class: 'icon-btn', style: { width: '32px', height: '32px' }, onclick: onClose }, icon('x', { size: 18 })),
  ]));
  modal.appendChild(el('div', { class: 'modal-body' }, contentNode));
  overlay.appendChild(modal);
  return overlay;
}

/* ---------------- Overlay 總控（drawer + modal 可疊加顯示） ---------------- */
function renderOverlay() {
  const root = refs.overlayRoot;
  root.innerHTML = '';
  if (state.selectedProductId) {
    const product = state.data.products.find((p) => p.id === state.selectedProductId);
    if (product) {
      root.appendChild(el('div', { class: 'overlay-backdrop', onclick: closeOverlayLayer('drawer') }));
      root.appendChild(buildDrawer(product));
    }
  }
  if (state.addProductPreset) root.appendChild(buildAddProductModal(state.addProductPreset));
  if (state.showAddPriceFor) root.appendChild(buildAddPriceModal(state.showAddPriceFor.productId, state.showAddPriceFor.editRecord));
  if (state.showSettings) root.appendChild(buildSettingsModal());
}

function renderToast() {
  const root = refs.toastRoot;
  root.innerHTML = '';
  if (!state.toast) return;
  const t = state.toast;
  const children = [el('span', {}, t.msg)];
  if (t.action) {
    children.push(el('button', {
      class: 'toast-action',
      onclick: () => {
        clearTimeout(toastTimer);
        state.toast = null;
        renderToast();
        t.action.onClick();
      },
    }, t.action.label));
  }
  root.appendChild(el('div', { class: 'toast' + (t.action ? ' with-action' : '') }, children));
}

/* ---------------- 啟動 ---------------- */
async function boot() {
  const cloudData = await cloudLoad();
  let loaded = cloudData;
  if (!loaded) loaded = localLoad();
  if (!loaded) loaded = defaultData();
  state.data = loaded;
  state.activeCategoryId = loaded.categories[0] ? loaded.categories[0].id : null;
  purgeOldRecycle();
  localSave(loaded);
  if (CLOUD_ENABLED && !cloudData) {
    // 雲端還沒有有效資料（例如剛建立的空白 Bin）：
    // 自動把本機現有資料同步上去，第一次開啟雲端同步時不用手動匯出/匯入。
    cloudSave(loaded);
  }

  buildShell();
  renderCategoryTabs();
  renderMain();
  renderOverlay();
  renderToast();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => { /* PWA 安裝非必要功能，失敗就略過 */ });
    });
  }

  /* ---------------------------------------------------------------------
     多分頁保護：如果同一個瀏覽器同時開了好幾個分頁，其中一個分頁存檔時，
     其他分頁會收到這個通知，立刻把自己記憶體裡的資料換成最新的，
     這樣那些「比較舊」的分頁之後存檔時，才不會把新資料整批蓋掉。
     --------------------------------------------------------------------- */
  window.addEventListener('storage', (e) => {
    if (e.key !== STORAGE_KEY || !e.newValue) return;
    try {
      const fresh = JSON.parse(e.newValue);
      if (!isValidData(fresh)) return;
      state.data = fresh;
      if (!state.data.categories.find((c) => c.id === state.activeCategoryId)) {
        state.activeCategoryId = state.data.categories[0] ? state.data.categories[0].id : null;
      }
      renderCategoryTabs();
      renderMain();
      const hasOverlayOpen = state.selectedProductId || state.addProductPreset || state.showAddPriceFor || state.showSettings;
      if (hasOverlayOpen) {
        showToast('偵測到其他分頁更新了資料，已在背景同步最新內容');
      }
    } catch (err) { /* 忽略格式不正確的情況 */ }
  });
}

boot();

</script>
</body>
</html>
