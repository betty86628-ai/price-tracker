<script>
window.addEventListener('error', function (e) {
  var root = document.getElementById('root');
  if (root && !root.innerHTML) {
    root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#7c2d12;background:#fff7ed;min-height:100vh;line-height:1.6;">' +
      '<b>頁面載入時發生錯誤</b><br/>' + (e.message || '未知錯誤') +
      '<br/><br/>這個版本不依賴任何外部套件，如果還是看到這個訊息，麻煩截圖回報。</div>';
  }
});
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
/* ---------- reset & base ---------- */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#fff7ed;color:#292524;-webkit-font-smoothing:antialiased;}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
input,select,textarea{font:inherit;color:inherit;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
.font-display{font-family:'Fraunces',ui-serif,Georgia,serif;}
.font-body{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;}
.tabular{font-variant-numeric:tabular-nums;}

/* ---------- layout utilities ---------- */
.flex{display:flex;} .flex-col{flex-direction:column;} .flex-wrap{flex-wrap:wrap;}
.items-center{align-items:center;} .items-baseline{align-items:baseline;} .items-start{align-items:flex-start;}
.justify-between{justify-content:space-between;} .justify-center{justify-content:center;} .justify-end{justify-content:flex-end;}
.flex-1{flex:1 1 0%;} .shrink-0{flex-shrink:0;} .min-w-0{min-width:0;}
.grid{display:grid;} .grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.hidden{display:none !important;}
.relative{position:relative;} .absolute{position:absolute;} .fixed{position:fixed;} .sticky{position:sticky;}
.inset-0{top:0;right:0;bottom:0;left:0;}
.gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}
.w-full{width:100%;} .h-full{height:100%;}
.max-w-app{max-width:720px;margin-left:auto;margin-right:auto;}
.min-h-screen{min-height:100vh;}
.overflow-x-auto{overflow-x:auto;} .overflow-y-auto{overflow-y:auto;}
.text-left{text-align:left;} .text-center{text-align:center;} .text-right{text-align:right;}
.rounded-sm{border-radius:6px;} .rounded{border-radius:10px;} .rounded-lg{border-radius:14px;} .rounded-xl{border-radius:18px;} .rounded-full{border-radius:999px;}
.shadow-sm{box-shadow:0 1px 3px rgba(41,37,36,0.08);}
.shadow-md{box-shadow:0 8px 20px -8px rgba(41,37,36,0.25);}
.shadow-lg{box-shadow:0 12px 30px -8px rgba(41,37,36,0.30);}
.shadow-2xl{box-shadow:0 24px 60px -12px rgba(41,37,36,0.45);}
.transition{transition:all .15s ease;}
.underline{text-decoration:underline;}
.opacity-75{opacity:.75;}

/* spacing */
.p1{padding:4px;} .p2{padding:8px;} .p3{padding:12px;} .p4{padding:16px;} .p5{padding:20px;} .p6{padding:24px;}
.px1{padding-left:4px;padding-right:4px;} .px2{padding-left:8px;padding-right:8px;} .px3{padding-left:12px;padding-right:12px;}
.px4{padding-left:16px;padding-right:16px;} .px5{padding-left:20px;padding-right:20px;} .px6{padding-left:24px;padding-right:24px;}
.py1{padding-top:4px;padding-bottom:4px;} .py1h{padding-top:6px;padding-bottom:6px;} .py2{padding-top:8px;padding-bottom:8px;}
.py2h{padding-top:10px;padding-bottom:10px;} .py3{padding-top:12px;padding-bottom:12px;} .py4{padding-top:16px;padding-bottom:16px;}
.py5{padding-top:20px;padding-bottom:20px;} .py16{padding-top:64px;padding-bottom:64px;}
.mt1{margin-top:4px;} .mt1h{margin-top:6px;} .mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;}
.mt5{margin-top:20px;} .mt6{margin-top:24px;}
.mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;}
.space-y-3 > * + *{margin-top:12px;} .space-y-4 > * + *{margin-top:16px;} .space-y-7 > * + *{margin-top:28px;}

/* typography sizes */
.text-10{font-size:10px;} .text-xs{font-size:12px;} .text-sm{font-size:14px;} .text-base{font-size:16px;}
.text-lg{font-size:18px;} .text-xl{font-size:22px;} .text-2xl{font-size:26px;}
.font-medium{font-weight:500;} .font-semibold{font-weight:600;} .font-bold{font-weight:700;}
.leading-tight{line-height:1.25;} .leading-snug{line-height:1.35;} .leading-relaxed{line-height:1.6;}

/* palette */
.bg-page{background:#fff7ed;}
.bg-white{background:#ffffff;}
.bg-stone-100{background:#f5f5f4;}
.bg-stone-800{background:#292524;}
.bg-orange-50{background:#fff7ed;}
.bg-orange-100{background:#ffedd5;}
.bg-orange-600{background:#ea580c;}
.bg-orange-700{background:#c2410c;}
.bg-emerald-50{background:#ecfdf5;}
.bg-emerald-600{background:#059669;}
.bg-rose-50{background:#fff1f2;}
.bg-black-50{background:rgba(0,0,0,.5);}

.text-white{color:#ffffff;}
.text-ink{color:#292524;}
.text-muted{color:#78716c;}
.text-faint{color:#a8a29e;}
.text-faint2{color:#d6d3d1;}
.text-orange-200{color:#fed7aa;}
.text-orange-600{color:#ea580c;}
.text-emerald-600{color:#059669;}
.text-emerald-700{color:#047857;}
.text-amber-700{color:#b45309;}
.text-rose-600{color:#e11d48;}

.border{border:1px solid #ffedd5;}
.border-t{border-top:1px solid #ffedd5;}
.border-dashed{border-style:dashed;border-color:#fed7aa;}
.border-orange-200{border-color:#fed7aa;}
.border-transparent{border-color:transparent;}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:600;transition:background .15s ease,border-color .15s ease,color .15s ease;}
.btn-primary{background:#ea580c;color:#fff;}
.btn-primary:hover{background:#c2410c;}
.btn-outline{background:#fff;border:1px solid #ffedd5;color:#292524;}
.btn-outline:hover{border-color:#fdba74;}
.btn-danger-outline{background:#fff;border:1px solid #ffedd5;color:#e11d48;}
.btn-danger-outline:hover{background:#fff1f2;}
.icon-btn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #fed7aa;color:#78716c;}
.icon-btn:hover{color:#ea580c;border-color:#fdba74;}
.field-input{width:100%;padding:10px 12px;border-radius:14px;border:1px solid #ffedd5;background:#fff;font-size:14px;color:#292524;outline:none;}
.field-input:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,0.15);}
.field-label{font-size:12px;color:#a8a29e;display:block;margin-bottom:4px;}
textarea.field-input{resize:none;}

/* ---------- header ---------- */
.app-header{position:sticky;top:0;z-index:30;background:#fff7ed;border-bottom:1px solid #ffedd5;}
.accent-rule{height:4px;background:linear-gradient(to right,#fdba74,#f97316,#fdba74);}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-badge{width:32px;height:32px;border-radius:999px;background:#fff;border:1px solid #fed7aa;display:flex;align-items:center;justify-content:center;color:#ea580c;flex-shrink:0;}
.brand-title{font-size:18px;line-height:1;color:#292524;}
.brand-sub{font-size:12px;color:#a8a29e;line-height:1;margin-top:4px;}
.search-wrap{position:relative;padding:0 16px 10px;}
.search-icon{position:absolute;left:32px;top:50%;transform:translateY(-50%);color:#a8a29e;}
.search-input{width:100%;padding:10px 12px 10px 38px;border-radius:999px;border:1px solid #fed7aa;background:#fff;font-size:14px;outline:none;}
.search-input:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,0.15);}
.category-tabs{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 16px;}
.category-tab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px;border-radius:16px;border:1px solid transparent;color:#a8a29e;}
.category-tab.active{background:#fff;border-color:#fed7aa;box-shadow:0 1px 3px rgba(41,37,36,0.06);color:#292524;}
.category-tab.active .cat-icon{color:#ea580c;}
.category-tab-label{font-size:12px;}
.category-tab-add{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px;color:#a8a29e;}
.category-tab-add:hover{color:#ea580c;}
.cat-add-input{width:96px;padding:6px 10px;font-size:14px;border:1px solid #fed7aa;border-radius:10px;background:#fff;outline:none;}
.filter-row{display:flex;gap:8px;padding:4px 16px 12px;}
.filter-select{padding:6px 12px;border-radius:999px;border:1px solid #fed7aa;background:#fff;font-size:14px;color:#57534e;}

/* ---------- main / sections / cards ---------- */
.main{max-width:720px;margin:0 auto;padding:20px 16px;}
.section{margin-bottom:24px;}
.section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.section-title-wrap{display:flex;align-items:baseline;gap:8px;}
.section-title{font-size:18px;color:#292524;}
.section-count{font-size:12px;color:#a8a29e;}
.section-add-btn{width:28px;height:28px;border-radius:999px;background:#fff;border:1px solid #fed7aa;display:flex;align-items:center;justify-content:center;color:#ea580c;}
.section-add-btn:hover{background:#fff7ed;}
.product-list{display:flex;flex-direction:column;gap:12px;}
.product-card{position:relative;width:100%;text-align:left;background:#fff;border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;border:1px solid #ffedd5;transition:all .15s ease;}
.product-card:hover{border-color:#fdba74;box-shadow:0 8px 20px -10px rgba(41,37,36,0.25);}
.product-thumb{width:64px;height:64px;border-radius:14px;background:#fff7ed;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.product-thumb img{width:100%;height:100%;object-fit:cover;}
.product-info{flex:1;min-width:0;}
.product-brand{font-size:14px;font-weight:500;color:#ea580c;}
.product-name{font-family:'Fraunces',serif;font-size:16px;color:#292524;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.product-spec{font-size:12px;color:#a8a29e;margin-top:4px;}
.price-badge-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:64px;}
.price-badge{width:64px;height:64px;border-radius:999px;background:#ecfdf5;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.price-badge-empty{width:64px;height:64px;border-radius:999px;background:#f5f5f4;display:flex;align-items:center;justify-content:center;font-size:12px;color:#a8a29e;}
.price-badge-currency{font-size:14px;font-weight:700;color:#059669;}
.price-badge-label{font-size:10px;color:#059669;}
.price-badge-sub{font-size:12px;color:#a8a29e;margin-top:6px;text-align:center;line-height:1.3;}
.empty-state{text-align:center;padding:64px 0;color:#a8a29e;}

.fab{display:none;position:fixed;bottom:20px;right:20px;z-index:30;width:56px;height:56px;border-radius:999px;background:#ea580c;color:#fff;align-items:center;justify-content:center;box-shadow:0 12px 30px -8px rgba(41,37,36,0.30);}

/* ---------- overlay / drawer / modal ---------- */
.overlay-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:480px;background:#fff;z-index:41;overflow-y:auto;box-shadow:-12px 0 30px -8px rgba(41,37,36,0.30);}
.drawer-header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ffedd5;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;z-index:2;}
.drawer-body{padding:0 24px 32px;}
.drawer-image{height:160px;background:#fff7ed;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:20px 0 16px;}
.drawer-image img{width:100%;height:100%;object-fit:cover;}
.drawer-brand{font-size:14px;font-weight:500;color:#ea580c;}
.drawer-title{font-family:'Fraunces',serif;font-size:24px;color:#292524;margin-top:4px;}
.drawer-spec{font-size:12px;color:#a8a29e;margin-top:4px;}
.drawer-note{font-size:14px;color:#57534e;line-height:1.6;margin-top:12px;}
.drawer-actions{display:flex;gap:8px;margin-top:20px;}
.price-list{border:1px solid #ffedd5;border-radius:18px;padding:0 12px;background:#fff;}
.price-list > .price-row + .price-row{border-top:1px solid #fff7ed;}
.price-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;}
.price-row.best{background:#fff7ed;margin:0 -12px;padding:12px;border-radius:14px;}
.price-row-main{min-width:0;flex:1;}
.price-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.price-row-store{font-weight:500;font-size:14px;color:#292524;}
.price-row-country{font-size:12px;color:#a8a29e;}
.tag-chip{font-size:12px;padding:2px 6px;border-radius:6px;background:#f5f5f4;color:#78716c;}
.tag-chip.sale{background:#fef3c7;color:#b45309;}
.tag-chip.bundle{background:#ecfdf5;color:#047857;}
.badge-best{font-size:12px;padding:2px 6px;border-radius:6px;background:#ea580c;color:#fff;font-weight:500;}
.badge-unit-best{font-size:12px;padding:2px 6px;border-radius:6px;background:#059669;color:#fff;font-weight:500;}
.price-row-sub{font-size:12px;color:#a8a29e;margin-top:2px;}
.price-row-date{font-size:12px;color:#d6d3d1;margin-top:2px;}
.toggle-link{font-size:12px;color:#a8a29e;text-decoration:underline;margin-top:4px;display:inline-block;}
.toggle-link:hover{color:#ea580c;}
.price-row-amount{text-align:right;flex-shrink:0;}
.price-amount{font-weight:600;color:#292524;}
.price-amount.best{color:#ea580c;}
.price-approx{font-size:12px;color:#a8a29e;}
.price-unit{font-size:12px;color:#a8a29e;margin-top:2px;}
.price-unit.best{color:#059669;font-weight:500;}
.history-toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:#a8a29e;margin-top:8px;}
.history-toggle:hover{color:#ea580c;}
.history-list{margin-top:12px;border:1px dashed #fed7aa;border-radius:18px;padding:0 12px;background:#fff7ed;}
.history-list > div + div{border-top:1px solid #ffedd5;}
.hint-box{font-size:12px;color:#047857;background:#ecfdf5;border-radius:10px;padding:8px 12px;margin-bottom:8px;}
.cloud-status{font-size:12px;border-radius:10px;padding:10px 12px;}
.cloud-status.on{background:#ecfdf5;color:#047857;}
.cloud-status.off{background:#f5f5f4;color:#78716c;}

.modal-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);}
.modal{background:#fff;width:100%;max-width:420px;border-radius:24px 24px 0 0;max-height:90vh;overflow-y:auto;border:1px solid #ffedd5;box-shadow:0 24px 60px -12px rgba(41,37,36,0.45);}
.modal.wide{max-width:640px;}
.modal-header{position:sticky;top:0;background:#fff;border-bottom:1px dashed #fed7aa;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;z-index:2;}
.modal-title{font-family:'Fraunces',serif;font-size:20px;color:#292524;}
.modal-body{padding:24px;}
.field{margin-bottom:16px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.type-toggle-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.type-toggle-btn{padding:10px;border-radius:14px;font-size:14px;border:1px solid #ffedd5;background:#fff;color:#78716c;}
.type-toggle-btn.active{background:#292524;color:#fff;border-color:#292524;}
.submit-btn{width:100%;padding:12px;border-radius:14px;background:#ea580c;color:#fff;font-size:14px;font-weight:600;}
.submit-btn:hover{background:#c2410c;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;background:#292524;color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 12px 30px -8px rgba(41,37,36,0.30);max-width:calc(100vw - 96px);white-space:nowrap;}

@media (min-width:640px){
  .fab{display:none !important;}
  .header-add-desktop{display:inline-flex !important;}
  .grid-cols-2-sm{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width:639px){
  .header-add-desktop{display:none !important;}
  .fab{display:flex;}
}

/* ---------- v2 additions: toast action / last-updated / misc ---------- */
.toast.with-action{display:flex;align-items:center;gap:14px;}
.toast-action{color:#fdba74;font-weight:600;text-decoration:underline;white-space:nowrap;}
.toast-action:hover{color:#fed7aa;}
.product-updated{font-size:11px;color:#d6d3d1;margin-top:4px;}

/* ---------- v3 additions: must-buy marking, recycle bin, export options ---------- */
.icon-btn.active-star{background:#fff7ed;border-color:#ea580c;color:#ea580c;}
.must-buy-badge{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:999px;background:#ea580c;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(41,37,36,0.25);}
.must-buy-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:#ea580c;background:#ffedd5;border-radius:999px;padding:4px 10px;margin-top:8px;width:fit-content;}
.recycle-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #fff7ed;}
.recycle-item:last-child{border-bottom:none;}
.recycle-item-title{font-size:14px;color:#292524;}
.recycle-item-sub{font-size:11px;color:#a8a29e;margin-top:2px;}
.recycle-actions{display:flex;gap:10px;flex-shrink:0;}
.recycle-actions button{font-size:12px;text-decoration:underline;white-space:nowrap;}

/* ---------- v4 additions: liked marking, subcategory/product ordering ---------- */
.icon-btn.active-heart{background:#fff1f2;border-color:#e11d48;color:#e11d48;}
.liked-badge{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:999px;background:#e11d48;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(41,37,36,0.25);}
.liked-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:#e11d48;background:#fff1f2;border-radius:999px;padding:4px 10px;margin-top:8px;width:fit-content;}
.order-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #fff7ed;}
.order-row:last-child{border-bottom:none;}
.order-row-title{font-size:14px;color:#292524;min-width:0;}
.order-arrows{display:flex;gap:4px;flex-shrink:0;}
.order-arrow-btn{width:28px;height:28px;border-radius:8px;border:1px solid #ffedd5;background:#fff;display:flex;align-items:center;justify-content:center;color:#78716c;}
.order-arrow-btn:hover{border-color:#fdba74;color:#ea580c;}
.order-arrow-btn:disabled{opacity:.3;}

/* ---------- v5 additions: drag-to-reorder lists ---------- */
.drag-list{display:flex;flex-direction:column;}
.drag-row{display:flex;align-items:center;gap:10px;background:#fff;position:relative;touch-action:none;}
.drag-row.dragging-row{z-index:10;box-shadow:0 8px 20px -6px rgba(41,37,36,0.3);background:#fff7ed;border-radius:10px;}
.drag-handle{flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#d6d3d1;cursor:grab;touch-action:none;}
.drag-handle:active{cursor:grabbing;color:#ea580c;}
.drag-row-content{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #fff7ed;}
.drag-row:last-child .drag-row-content{border-bottom:none;}

.card-field-chip{font-size:10.5px;padding:1px 7px;border-radius:999px;background:#fef3c7;color:#92400e;}

.cloud-status.warn{background:#fff1f2;color:#be123c;}

</style>
</head>
<body>
<div id="root"></div>

function el(tag, props, children) {
  props = props || {};
  children = children || [];
  const node = document.createElement(tag);
  Object.keys(props).forEach((k) => {
    const v = props[k];
    if (v === undefined || v === null || v === false) return;
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') node.innerHTML = v;
    else node.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return node;
}

}

function formatDate(iso) {

  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 900;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
function daysSince(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diff = Math.floor((now - then) / (1000 * 60 * 60 * 24));
  if (diff <= 0) return '今天更新';
  return `${diff} 天前更新`;
}
function nowLocalInput() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function parseCapacity(str) {
  if (!str) return null;
  const m = String(str).trim().match(/([\d.]+)\s*([a-zA-Z\u4e00-\u9fa5]*)/);
  if (!m) return null;
  const amount = parseFloat(m[1]);
  if (isNaN(amount) || amount <= 0) return null;
  const unit = (m[2] || '單位').trim() || '單位';
  return { amount, unit };
}
function toTwd(currency, price, rates) {
  if (currency === 'TWD') return price;
  if (rates[currency]) return price / rates[currency];
  return null;
}
function getUnitPrice(record, fallbackSpec, rates) {
  const capacityStr = record.capacity || fallbackSpec;
  const parsed = parseCapacity(capacityStr);
  if (!parsed) return null;
  const twd = toTwd(record.currency, record.price, rates);
  if (twd == null) return null;
  return { value: twd / parsed.amount, unit: parsed.unit };
}

/* ---------------- 儲存層：本機（一定會存） + 雲端（選用） ---------------- */
function localLoad() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function localSave(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return { ok: true };
  } catch (e) {
    return { ok: false, quotaExceeded: e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014) };
  }
}
function isValidData(d) {
  return !!d && Array.isArray(d.categories) && Array.isArray(d.products) && Array.isArray(d.priceRecords);
}
async function cloudLoad() {
  if (!CLOUD_ENABLED) return null;
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}.json`);
    if (!res.ok) return null;
    const json = await res.json();
    // 資料庫剛建立時是空的（null），這種「格式不對」的內容視同沒有資料，
    // 改用本機資料，避免第一次開雲端同步時，本機原有的資料被空白蓋掉。
    return isValidData(json) ? json : null;
  } catch (e) { return null; }
}
async function cloudSave(data) {
  if (!CLOUD_ENABLED) return false;
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    return res.ok;
  } catch (e) { return false; }
}

const STORAGE_WARN_BYTES = 3.5 * 1024 * 1024;
let storageWarnedThisSession = false;
function checkStorageWarning() {
  if (storageWarnedThisSession) return;
  try {
    const totalBytes = new Blob([JSON.stringify(state.data)]).size;
    if (totalBytes > STORAGE_WARN_BYTES) {
      storageWarnedThisSession = true;
      showToast('⚠️ 儲存空間快滿了，建議到設定頁清理照片或回收桶');
    }
  } catch (e) { /* ignore */ }
}

function persistData() {
  const result = localSave(state.data);
  if (!result.ok) {
    /* 這是真的存檔失敗、不是裝飾用的提示，所以用會擋住操作的 alert，
       確保使用者一定會看到，不會像之前一樣「默默存檔失敗」卻沒人知道。 */
    const msg = result.quotaExceeded
      ? '⚠️ 儲存失敗：瀏覽器的儲存空間已滿！\n\n剛剛這個修改沒有真的存進去，重新整理就會消失。\n\n請馬上到設定頁「匯出 JSON」備份目前畫面上看到的資料，然後清理一些商品照片或回收桶騰出空間。'
      : '⚠️ 儲存失敗，剛剛這個修改可能沒有存進去。\n\n建議馬上到設定頁「匯出 JSON」備份，避免資料遺失。';
    alert(msg);
  } else {
    checkStorageWarning();
  }
  if (CLOUD_ENABLED) {
    cloudSave(state.data).then((ok) => { if (!ok) showToast('雲端同步失敗，已先儲存在本機'); });
  }
}

/* ---------------- 回收桶：刪除的商品／價格紀錄會先放這裡 30 天，之後自動清除 ---------------- */
const RECYCLE_RETENTION_DAYS = 30;
function moveToRecycle(entry) {
  if (!state.data.recycle) state.data.recycle = [];
  const full = Object.assign({ id: 'rc-' + uid(), deletedAt: new Date().toISOString() }, entry);
  state.data.recycle.push(full);
  return full;
}
function purgeOldRecycle() {
  if (!state.data.recycle) { state.data.recycle = []; return; }
  const cutoff = Date.now() - RECYCLE_RETENTION_DAYS * 24 * 60 * 60 * 1000;
  state.data.recycle = state.data.recycle.filter((e) => new Date(e.deletedAt).getTime() > cutoff);
}
function restoreRecycleEntry(id) {
  const entry = (state.data.recycle || []).find((e) => e.id === id);
  if (!entry) return;
  state.data.recycle = state.data.recycle.filter((e) => e.id !== id);
  if (entry.type === 'product') {
    state.data.products.push(entry.product);
    state.data.priceRecords = state.data.priceRecords.concat(entry.priceRecords || []);
  } else if (entry.type === 'priceRecord') {
    state.data.priceRecords.push(entry.record);
  } else if (entry.type === 'category') {
    state.data.categories.push(entry.category);
    state.data.products = state.data.products.concat(entry.products || []);
    state.data.priceRecords = state.data.priceRecords.concat(entry.priceRecords || []);
  }
  persistData();
  renderCategoryTabs();
  renderMain();
  if (state.selectedProductId) renderOverlay();
}

function deleteCategoryWithContents(categoryId) {
  if (state.data.categories.length <= 1) { showToast('至少要保留一個分類'); return null; }
  const cat = state.data.categories.find((c) => c.id === categoryId);
  if (!cat) return null;
  const prods = state.data.products.filter((p) => p.categoryId === categoryId);
  const prodIds = prods.map((p) => p.id);
  const recs = state.data.priceRecords.filter((r) => prodIds.indexOf(r.productId) !== -1);
  state.data.categories = state.data.categories.filter((c) => c.id !== categoryId);
  state.data.products = state.data.products.filter((p) => p.categoryId !== categoryId);
  state.data.priceRecords = state.data.priceRecords.filter((r) => prodIds.indexOf(r.productId) === -1);
  const entry = moveToRecycle({ type: 'category', category: cat, products: prods, priceRecords: recs });
  if (state.activeCategoryId === categoryId) {
    state.activeCategoryId = state.data.categories[0] ? state.data.categories[0].id : null;
    state.filters = { subcategory: 'all', brand: 'all', search: '', custom: {}, sort: 'default' };
  }
  persistData();
  return entry;
}
function permanentlyDeleteRecycleEntry(id) {
  state.data.recycle = (state.data.recycle || []).filter((e) => e.id !== id);
  persistData();
}

/* ---------------- 可拖曳排序清單（手機觸控／滑鼠都適用） ----------------
   keys: 目前順序的 id 陣列
   renderRowContent(key, index): 回傳這一列中「握把以外」要顯示的內容 DOM
   onCommit(newOrderKeys): 拖曳放開、順序確定改變時呼叫，用來真正寫回資料
   ------------------------------------------------------------------- */
function buildDragList(keys, renderRowContent, onCommit) {
  const container = el('div', { class: 'drag-list' });
  let order = keys.slice();

  function buildRow(key) {
    const row = el('div', { class: 'order-row drag-row' });
    row.dataset.key = key;
    const handle = el('div', { class: 'drag-handle' }, icon('grip', { size: 16, filled: true, strokeWidth: 0 }));
    const content = renderRowContent(key);
    row.appendChild(handle);
    row.appendChild(content);
    wireDrag(row, handle, key);
    return row;
  }

  function renderAll() {
    container.innerHTML = '';
    order.forEach((k) => container.appendChild(buildRow(k)));
  }

  function wireDrag(row, handle, key) {
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      row.classList.add('dragging-row');
      const rowHeight = row.offsetHeight;
      let lastY = e.clientY;
      let curY = 0;
      let changed = false;

      function onMove(ev) {
        const dy = ev.clientY - lastY;
        lastY = ev.clientY;
        curY += dy;
        let idx = order.indexOf(key);
        while (curY > rowHeight / 2 && idx < order.length - 1) {
          order[idx] = order[idx + 1]; order[idx + 1] = key;
          container.insertBefore(container.children[idx + 1], row);
          curY -= rowHeight; idx++; changed = true;
        }
        while (curY < -rowHeight / 2 && idx > 0) {
          order[idx] = order[idx - 1]; order[idx - 1] = key;
          container.insertBefore(row, container.children[idx - 1]);
          curY += rowHeight; idx--; changed = true;
        }
        row.style.transform = `translateY(${curY}px)`;
      }
      function onUp(ev) {
        handle.releasePointerCapture(ev.pointerId);
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        row.classList.remove('dragging-row');
        row.style.transform = '';
        if (changed) onCommit(order.slice());
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });
  }

  renderAll();
  return container;
}

/* ---------------- 手動排序：次分類順序、以及同次分類內商品的順序 ---------------- */
function moveSubcategoryAmongUsed(categoryId, usedList, subName, direction) {
  const idx = usedList.indexOf(subName);
  const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
  if (idx < 0 || swapIdx < 0 || swapIdx >= usedList.length) return;
  const other = usedList[swapIdx];
  state.data.categories = state.data.categories.map((c) => {
    if (c.id !== categoryId) return c;
    const arr = c.subcategories.slice();
    const i = arr.indexOf(subName);
    const j = arr.indexOf(other);
    if (i === -1 || j === -1) return c;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    return Object.assign({}, c, { subcategories: arr });
  });
  persistData();
}
function moveProductWithinSubcategory(productId, direction) {
  const arr = state.data.products;
  const product = arr.find((p) => p.id === productId);
  if (!product) return;
  const siblingIdx = [];
  arr.forEach((p, i) => { if (p.categoryId === product.categoryId && p.subcategory === product.subcategory) siblingIdx.push(i); });
  const posInSiblings = siblingIdx.indexOf(arr.indexOf(product));
  const swapWith = direction === 'up' ? posInSiblings - 1 : posInSiblings + 1;
  if (swapWith < 0 || swapWith >= siblingIdx.length) return;
  const i = siblingIdx[posInSiblings];
  const j = siblingIdx[swapWith];
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  persistData();
}
function setSubcategoryOrderAmongUsed(categoryId, usedList, newOrder) {
  state.data.categories = state.data.categories.map((c) => {
    if (c.id !== categoryId) return c;
    const arr = c.subcategories.slice();
    const positions = [];
    arr.forEach((s, i) => { if (usedList.indexOf(s) !== -1) positions.push(i); });
    positions.forEach((pos, idx) => { arr[pos] = newOrder[idx]; });
    return Object.assign({}, c, { subcategories: arr });
  });
  persistData();
}
function setProductOrderWithinSubcategory(categoryId, subcategory, newOrderIds) {
  const arr = state.data.products;
  const positions = [];
  arr.forEach((p, i) => { if (p.categoryId === categoryId && p.subcategory === subcategory) positions.push(i); });
  const idToProduct = {};
  newOrderIds.forEach((id) => { idToProduct[id] = arr.find((p) => p.id === id); });
  positions.forEach((pos, idx) => { arr[pos] = idToProduct[newOrderIds[idx]]; });
  persistData();
}
